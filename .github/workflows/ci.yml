name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux fzf zsh shellcheck
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux fzf shellcheck
      - run: tmux -V
      - run: rustup component add clippy rustfmt
      - run: make lint test

  python39:
    # macOS still ships Python 3.9 as /usr/bin/python3. setup-python has no 3.9 for new
    # runners (it is end of life), so the job runs in the official image instead.
    name: Python 3.9 runtime
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v5
      - name: Runtime code compiles on Python 3.9
        run: for f in bin/tmux-workspace bin/install-integrations lib/*.py integrations/agent-hook.py scripts/*.py; do python -m py_compile "$f"; done
      - run: python -m unittest tests.test_workspace_model tests.test_dashboard

  install-linux:
    name: Install on ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12', 'fedora:latest', 'archlinux:latest', 'alpine:3.20']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tests/install/matrix.sh '${{ matrix.image }}'

  install-macos:
    name: Install on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash install.sh --deps --yes --projects "$HOME/Projects"
      - run: sh tests/install/smoke.sh --checks
