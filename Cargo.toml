[package]
name = "tmux-workspace"
version = "2.2.0"
edition = "2024"
rust-version = "1.89"
description = "Personal tmux controls and private, allowlisted workspace recovery"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "tmux-workspace"
path = "src/main.rs"

[features]
# Test support (ScratchTmux and friends) for the integration tests in tests/.
testing = []

[dependencies]
libc = "0.2"
regex = "1"
# Codex identity reads Codex's state_*.sqlite.
rusqlite = { version = "0.41", features = ["bundled"] }
# float_roundtrip: parse floats exactly like Python, so re-written JSON keeps its numbers.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
unicode-normalization = "0.1"
unicode-width = "0.2"
# Pure-Rust HTTPS (rustls + ring + bundled webpki-roots): static musl-friendly, zero OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[[test]]
name = "cli"
required-features = ["testing"]

[[test]]
name = "hook_tmux"
required-features = ["testing"]

[[test]]
name = "calls"
required-features = ["testing"]

[[test]]
name = "recovery"
required-features = ["testing"]

[[test]]
name = "park"
required-features = ["testing"]

[[test]]
name = "pickers"
required-features = ["testing"]

[[test]]
name = "integrations"
required-features = ["testing"]

[[test]]
name = "doctor"
required-features = ["testing"]

[[test]]
name = "report"
required-features = ["testing"]

[[test]]
name = "dash"
required-features = ["testing"]

[[test]]
name = "cleanup"
required-features = ["testing"]

[[test]]
name = "ai"
required-features = ["testing"]

[[test]]
name = "agent_status"
required-features = ["testing"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
