# Personal workspace controls. Ctrl+a, release, then the command key.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g default-shell /bin/zsh
set -g default-command 'exec /Users/kh/.local/bin/tmux-workspace pane-start'
set -g default-terminal tmux-256color
set -s terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-ghostty:RGB:hyperlinks:sync:usstyle,xterm-256color:RGB'
set -s extended-keys on
# CSI u lets Ghostty deliver Ctrl+Enter, Shift+Enter and friends to agents and Neovim inside tmux.
set -s extended-keys-format csi-u
# Image previews and OSC 8/52 from Neovim, yazi and agents reach Ghostty through tmux.
set -g allow-passthrough on
set -g escape-time 10
set -g repeat-time 800
set -g mouse on
set -g focus-events on
set -g set-titles on
set -g set-titles-string '#S / #W'
set -g display-time 3000
set -g history-limit 100000
set -g display-panes-time 2000
setw -g aggressive-resize on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-clipboard external
setw -g mode-keys vi
setw -g automatic-rename off
setw -g allow-rename off

# New panes inherit the current directory and ask for a persistent label.
bind | split-window -h -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c command-prompt -p "Tab name:" "run-shell '/Users/kh/.local/bin/tmux-workspace new-tab \"%%\" \"#{pane_current_path}\"'"
bind t display-popup -E -w 60% -h 8 '/Users/kh/.local/bin/tmux-workspace label'
bind x confirm-before -p 'Close pane #{@workspace_label}? (y/n)' kill-pane

# Hold/repeat a direction after one prefix; uppercase or Shift+arrows resize.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r Left select-pane -L
bind -r Down select-pane -D
bind -r Up select-pane -U
bind -r Right select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 3
bind -r S-Up resize-pane -U 3
bind -r S-Right resize-pane -R 5
bind -r o select-pane -t :.+
bind ';' last-pane
# Move the current tab left or right; the view follows it.
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind Space next-layout
bind z resize-pane -Z

# Park a single pane, keeping its process alive outside the visible workspace.
bind ! run-shell -b '/Users/kh/.local/bin/tmux-workspace park #{pane_id}'
bind u run-shell -b '/Users/kh/.local/bin/tmux-workspace unpark #{pane_id} right'
bind b run-shell -b '/Users/kh/.local/bin/tmux-workspace unpark #{pane_id} below'
bind U display-popup -E -w 70% -h 70% '/Users/kh/.local/bin/tmux-workspace choose-park right'
bind B display-popup -E -w 70% -h 70% '/Users/kh/.local/bin/tmux-workspace choose-park below'

# sesh manages project sessions; its picker hides parked-pane storage.
bind s display-popup -E -w 80% -h 80% '/Users/kh/.local/bin/tmux-workspace open'
bind Tab run-shell -b 'sesh last'
bind w display-popup -E -w 85% -h 75% '/Users/kh/.local/bin/tmux-workspace pick-window'
bind W choose-tree -Zw -f '#{!=:#{session_name},__parked}'
bind X confirm-before -p 'Close workspace #S? (y/n)' 'run-shell "/Users/kh/.local/bin/tmux-workspace kill-workspace #S"'

# On-demand AI tools; terminal content stays private until per-pane opt-in.
bind a run-shell -C 'display-popup -E -e TMUX_PANE=#{pane_id} -d #{q:pane_current_path} -w 95% -h 90% "/Users/kh/.local/bin/tmux-workspace ai"'

# Floating tools in the pane's directory. They close with the program and never join a snapshot.
bind g display-popup -E -w 92% -h 90% -d '#{pane_current_path}' 'lazygit'
bind e display-popup -E -w 80% -h 75% -d '#{pane_current_path}' -T ' scratch #{b:pane_current_path} ' 'exec zsh -i'
# Type into every pane of the tab at once; the status bar shows SYNC while it is on.
bind y setw synchronize-panes \; display 'Sync panes #{?synchronize-panes,on,off}'

# Recovery snapshots are private. No generic command replay is enabled.
bind C-s run-shell -b '/Users/kh/.local/bin/tmux-workspace save'
bind C-r run-shell -b '/Users/kh/.local/bin/tmux-workspace restore'
bind P display-popup -E -w 90% -h 90% '/Users/kh/.local/bin/tmux-workspace history'
bind r source-file ~/.tmux.conf \; display-message 'tmux configuration reloaded'
bind M if -F '#{==:#{@agent_sound},on}' { set -g @agent_sound off ; display 'Agent sounds off' } { set -g @agent_sound on ; display 'Agent sounds on' }
bind ? display-popup -E -w 90% -h 90% '/Users/kh/.local/bin/tmux-workspace help'
bind D display-popup -E -w 95% -h 90% '/Users/kh/.local/bin/tmux-workspace doctor | less -R'
bind C run-shell -C 'display-popup -E -e TMUX_PANE=#{pane_id} -w 90% -h 80% "/Users/kh/.local/bin/tmux-workspace cleanup"'

# Copy mode works like Neovim: v/V/Ctrl+v select, y yanks to the macOS clipboard, H/L jump in the line.
bind Enter copy-mode
bind ] run-shell 'pbpaste | tmux load-buffer - && tmux paste-buffer -p'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Y send-keys -X copy-pipe-end-of-line-and-cancel 'pbcopy'
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'
# Double-click copies a word, triple-click a line, without leaving the pane in copy mode.
bind -T root DoubleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -H ; send -X select-word ; run -d0.3 ; send -X copy-pipe-and-cancel 'pbcopy' }
bind -T root TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -H ; send -X select-line ; run -d0.3 ; send -X copy-pipe-and-cancel 'pbcopy' }
# Three lines per wheel notch instead of five feels closer to native scrolling.
bind -T copy-mode-vi WheelUpPane select-pane \; send -N3 -X scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -N3 -X scroll-down

# Labels are user options, so agent/editor terminal titles cannot overwrite them.
set -g pane-border-status top
set -g pane-border-lines heavy
# Tokyo Night, the palette the agent marks and Ghostty already use.
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g status-style 'bg=#16161e,fg=#a9b1d6'
set -g message-style 'bg=#283457,fg=#c0caf5,bold'
set -g message-command-style 'bg=#283457,fg=#c0caf5'
set -g mode-style 'bg=#283457,fg=#c0caf5'
set -g copy-mode-match-style 'bg=#3d59a1,fg=#c0caf5'
set -g copy-mode-current-match-style 'bg=#ff9e64,fg=#16161e'
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#7aa2f7'
set -g menu-border-lines rounded
set -g menu-selected-style 'bg=#283457,fg=#c0caf5'
setw -g clock-mode-colour '#7aa2f7'
set -g status-left-length 40
set -g status-right-length 100
set -g status-right '#{?client_prefix,#[fg=#16161e#,bg=#e0af68#,bold] PREFIX #[default] ,}#{?synchronize-panes,#[fg=#f7768e#,bold]SYNC#[default] | ,}#{?window_zoomed_flag,ZOOM | ,}#{?pane_in_mode,COPY | ,}#{?#{==:#{@agent_sound},off},muted | ,}#{?@workspace_save_error,#[fg=red]save ERROR#[default],save #{@workspace_saved}} | C-a D health | %a %H:%M '
set -g status-interval 15
source-file "/Users/kh/Projects/tmux-workspace/agent-status.conf"

# A tmux-owned timer also saves detached sessions. Reloads do not duplicate it.
set-hook -g session-created 'run-shell -b "/Users/kh/.local/bin/tmux-workspace init"'
run-shell -b '/Users/kh/.local/bin/tmux-workspace init'
